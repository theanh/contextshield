    input: "card number 4111 1111 1111 1111 expires 12/28"
    expect_finding: true
    description: "PAN in prose context"

  - rule_id: credit-card-pan
    class: regulated.credit_card
    input: "4111 1111 1111 1112"
    expect_finding: false
    description: "invalid Luhn — last digit changed"

  - rule_id: credit-card-pan
    class: regulated.credit_card
    input: "1730000000001"
    expect_finding: false
    description: "13-digit ms-epoch timestamp — passes Luhn but fails IIN (D-18)"

  - rule_id: credit-card-pan
    class: regulated.credit_card
    input: "1234567890123456"
    expect_finding: false
    description: "random 16-digit — fails Luhn"

  - rule_id: credit-card-pan
