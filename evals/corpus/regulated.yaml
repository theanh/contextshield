    class: regulated.iban
    input: "IBAN: GB82 WEST 1234 5698 7654 32"
    expect_finding: true
    description: "IBAN in prose context"

  - rule_id: iban
    class: regulated.iban
    input: "GB82 TEST 1234 5698 7654 32"
    expect_finding: false
    description: "invalid — TEST country code (no valid country)"

  - rule_id: iban
    class: regulated.iban
    input: "GB00 WEST 1234 5698 7654 32"
