    input: "1234 5678 9012 3456"
    expect_finding: false
    description: "sequential digits — fails Luhn"

  - rule_id: credit-card-pan
    class: regulated.credit_card
    input: "3711 1111 1111 115"
    expect_finding: false
    description: "Amex-prefix 15-digit with broken Luhn"

  # IBAN — deterministic: mod-97 + country code + country length
  # confidence: 1.0 (multi-constraint mathematical guarantee)

  - rule_id: iban
    class: regulated.iban
    input: "GB82 WEST 1234 5698 7654 32"
    expect_finding: true
    description: "valid UK IBAN"

  - rule_id: iban
