entries:
  # Credit Card PAN — deterministic with Luhn + IIN prefix + per-network length
  # confidence: 1.0 (multi-constraint deterministic)

  - rule_id: credit-card-pan
    class: regulated.credit_card
    input: "4111 1111 1111 1111"
    expect_finding: true
    description: "valid Visa PAN"

  - rule_id: credit-card-pan
    class: regulated.credit_card
    input: "5500 0000 0000 0004"
    expect_finding: true
    description: "valid Mastercard PAN (51-55 range)"

  - rule_id: credit-card-pan
    class: regulated.credit_card
    input: "3400 0000 0000 009"
    expect_finding: true
    description: "valid Amex 15-digit PAN"

  - rule_id: credit-card-pan
