id: generic-high-entropy-secret
class: secret.generic
severity: high
pattern: '(?i)(?:api[_-]?key|secret|token)["'']?\s*[:=]\s*["'']?([A-Za-z0-9_=-]{32,})'
max_match_len: 96
keywords: ["api_key", "api-key", "apikey", "secret", "token"]
validators: ["entropy"]
# Heuristic (entropy) class: never deterministic-by-construction, so < 1.0 by
# construction (Invariant 7 / D-18). Measured eval precision sets the policy
# min_confidence gate, not this intrinsic confidence.
confidence: 0.75
match_group: 1
examples:
  positive: ["api_key=Qa7xP2mN9vL4sT8rY1uI6oE3wA5dF0gH"]
  negative: ["api_key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"]

